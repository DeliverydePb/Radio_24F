<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codificador de Radio WPC</title>
    <style>
        /* Caja de tamaño más predecible y evitar overflow por padding */
        *, *::before, *::after { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }

        body { 
            font-family: sans-serif; 
            background-color: #1a1a24; /* Fondo principal oscuro */
            color: #e0e0e0; /* Texto claro para que se lea bien */
        }

        /* Contenedor ahora usa todo el ancho disponible sin límite fijo */
        .container { 
            width: 100%; 
            max-width: none; 
            margin: 0; 
            background: #2a2a35; /* Gris oscuro, pero más claro que el body */
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); /* Sombra más fuerte para dar profundidad */
        }

        h1, h2 { 
            color: #74b9ff; /* Azul claro pastel */
            border-bottom: 2px solid #3d3d4e; /* Línea divisoria oscura */
            padding-bottom: 10px; 
        }

        .section { 
            margin-bottom: 30px; 
            padding: 15px; 
            border: 1px solid #3d3d4e; /* Borde oscuro */
            border-radius: 5px; 
            background-color: #23232e; /* Fondo sutilmente distinto para agrupar elementos */
        }

        .row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        /* Permite que los hijos flex puedan reducir su ancho sin forzar scroll */
        .row > *, .result-box, .segment > * { min-width: 0; }

        select, input { 
            padding: 8px; 
            border: 1px solid #4a4a5e; 
            border-radius: 4px; 
            background-color: #333342; /* Fondo de la caja de texto */
            color: #ffffff; /* Letras blancas al escribir */
        }
        
        input::placeholder { 
            color: #888; /* Color gris para el texto de sugerencia */
        }

        button { padding: 8px 15px; cursor: pointer; border: none; border-radius: 4px; background-color: #3498db; color: white; transition: 0.3s; }
        button:hover { background-color: #2980b9; }
        button.add-btn { background-color: #27ae60; font-weight: bold; }

        .result-box { 
            margin-top: 20px; 
            padding: 15px; 
            background: #1e272e; /* Fondo muy oscuro, casi negro */
            border-left: 5px solid #0984e3; 
            font-family: monospace; 
            font-size: 1.2em; 
            min-height: 1.5em; 
            color: #00d2d3; /* Texto color cyan para que el código destaque */
            min-width: 0; /* evitar que el flex hijo genere overflow */
        }

        .translation-box { 
            color: #b2bec3; /* Gris claro apagado para no robar atención */
            font-style: italic; 
            margin-top: 5px; 
        }

        .segment { 
            border-left: 3px solid #00b894; 
            padding-left: 10px; 
            margin-left: 5px; 
            background-color: #2a2a35;
            padding-top: 10px;
            padding-bottom: 10px;
            border-radius: 0 4px 4px 0;
            display: flex;
            gap: 8px;
            flex-wrap: wrap; /* Permite que los controles salten de línea */
            align-items: center;
        }

        .segment > * {
            flex: 1 1 140px;
            min-width: 90px;
            max-width: 320px;
        }

        .segment input, .segment select {
            min-width: 70px;
        }

        /* Limita el ancho de los selectores dentro de los segmentos */
        .segment select {
            max-width: 140px; 
            text-overflow: ellipsis; /* Agrega "..." si el texto es muy largo */
        }

    </style>
</head>
<body>

<div class="container">
    <h1>Codificador / Decodificador WPC</h1>

    <div class="section">
        <h2>Codificar Mensaje</h2>
        <div id="codificador-form">
            <div class="row">
                <label>Emisor:</label>
                <select id="c-emisor" onchange="updateCodification()">
                    <option value="B">BDU (B)</option>
                    <option value="Z">U96 (Z)</option>
                    <option value="W">U552 (W)</option>
                    <option value="R">U564 (R)</option>
                    <option value="U">U307 (U)</option>
                </select>

                <label>Tipo:</label>
                <select id="c-tipo" onchange="updateCodification()">
                    <option value="ON">Orden (ON)</option>
                    <option value="QS">Pregunta (QS)</option>
                    <option value="IA">Informa (IA)</option>
                    <option value="SA">Solicitud (SA)</option>
                    <option value="CN">Confirmación (CN)</option>
                </select>

                <label>Receptor:</label>
                <select id="c-receptor" onchange="updateCodification()">
                    <option value="B">BDU (B)</option>
                    <option value="Z">U96 (Z)</option>
                    <option value="W">U552 (W)</option>
                    <option value="R">U564 (R)</option>
                    <option value="U">U307 (U)</option>
                    <option value="A">Todos (A)</option>
                </select>
            </div>

            <div id="dynamic-segments">
                </div>

            <div class="row">
                <button class="add-btn" onclick="addSegment()">+ Agregar Objeto/Estado</button>
            </div>

            <div class="row">
                <label>Cierre: <strong>E</strong></label>
            </div>
        </div>

        <div style="display: flex; gap: 10px; align-items: stretch; margin-top: 20px;">
            <div class="result-box" id="codified-output" style="flex-grow: 1; margin-top: 0;">B ON A E</div>
            <button onclick="copyToClipboard()" style="background-color: #f39c12; margin-top: 0;">Copiar</button>
        </div>
        <div class="translation-box" id="codified-translation">BDU ordena a todos: Fin.</div>
        
    </div>

    <div class="section">
        <h2>Traducir Mensaje Armado</h2>
        <p><small>Introduce las abreviaturas separadas por espacios para ver la traducción.</small></p>
        <input type="text" id="t-input" style="width: 80%;" placeholder="Ej: Z QS B SUBM POSI 082G E" oninput="translateRaw()">
        <div class="result-box" id="translation-output">---</div>
    </div>
</div>

<script>
    // Diccionarios basados en el documento [cite: 1, 4, 11, 23, 34, 47]
    const DATA = {
        emisor: { "B": "BDU", "Z": "U96", "W": "U552", "R": "U564", "U": "U307" },
        tipo: { "ON": "Ordena", "QS": "Pregunta", "IA": "Informa", "SA": "Solicita", "CN":  "Confirmación"},
        receptor: { "B": "a BDU", "Z": "a U96", "W": "a U552", "R": "a U564", "U": "a U307", "A": "a todos los submarinos" },
        objeto: { 
            "SUBM": "Submarino", "CONV": "Convoy", "TOIP": "Tiempo impacto", "VISU": "Contacto Visual", "HIDO": "Contacto Hidro",
            "BUQG": "Buque de Guerra", "MECA": "Mercante", "PASA": "Pasajeros", "TANP": "Tanquero pesado"
        },
        parametro: { 
            "POSI": "Posición", "RUMB": "Rumbo", "DIST": "Distancia", "VELO": "Velocidad", "DIRE": "Dirección", "AONB": "Angle on bow",
            "PROA": "Proa", "POPA": "Popa", "ESTR": "Estribor", "BABO": "Babor",
            "NORT": "Norte", "SUUR": "Sur", "ESTE": "Este", "OEST": "Oeste",
            "TORA": "Torpedos en agua", "TORE": "Torpedos restantes", "IDEN": "Identificación", "FURT": "Nav. Silenciosa" 
        },
        estado: { 
            "CONF": "Confirmación requerida", "AFIR": "Afirmativo", "NEGA": "Negativo", "OKOK": "Sin quejas", "SOSS": "Auxilio inmediato", 
            "INME": "Inmersión profunda", "EMER": "Inmersión emergencia", "FCOM": "Retirada combate", "FMIS": "Retirada misión" 
        }
    };

    // Reglas de sustitución para números
    const numToChar = {'1':'Q', '2':'W', '3':'E', '4':'R', '5':'T', '6':'Z', '7':'U', '8':'I', '9':'O', '0':'P'};
    const charToNum = {'Q':'1', 'W':'2', 'E':'3', 'R':'4', 'T':'5', 'Z':'6', 'U':'7', 'I':'8', 'O':'9', 'P':'0'};

    // Función para codificar (Números -> Letras)
    function encodeNumbers(str) {
        if (!str) return str;
        return str.toUpperCase().replace(/[0-9]/g, m => numToChar[m]);
    }

    // Función para decodificar (Letras -> Números)
    function decodeNumbers(str) {
        if (!str) return str;
        return str.toUpperCase().split('').map(c => charToNum[c] || c).join('');
    }

    function chunkString(str, size) {
        const chunks = [];
        for (let i = 0; i < str.length; i += size) {
            chunks.push(str.substr(i, size));
        }
        return chunks;
    }

    function normalizeDigits(str) {
        return (str || '').replace(/\D/g, '');
    }

    function formatQuadrant(value) {
        const v = (value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
        const match = v.match(/^([A-Z]{2})(\d{1,4})$/);
        if (!match) return null;
        return [`CU${match[1]}`, match[2].padStart(4, '0')];
    }

    function formatAngle(value) {
        const digits = normalizeDigits(value);
        if (!digits) return null;
        const angle = parseInt(digits, 10);
        if (Number.isNaN(angle) || angle < 0 || angle > 360) return null;
        return `G${angle.toString().padStart(3, '0')}`;
    }

    function formatDistance(value) {
        const digits = normalizeDigits(value).padStart(6, '0');
        if (!/^\d{6}$/.test(digits)) return null;
        return [`D${digits.slice(0, 3)}`, `${digits.slice(3)}M`];
    }

    function formatTime(value) {
        const digits = normalizeDigits(value).padStart(4, '0');
        if (!/^\d{4}$/.test(digits)) return null;
        return [`HH${digits.slice(0, 2)}`, `MM${digits.slice(2)}`];
    }

    function addSegment() {
        const container = document.getElementById('dynamic-segments');
        const div = document.createElement('div');
        div.className = 'row segment';
        div.innerHTML = `
            <select class="s-obj" onchange="updateCodification()">
                <option value="">(Sin Objeto)</option>
                ${Object.entries(DATA.objeto).map(([k,v]) => `<option value="${k}">${v} (${k})</option>`).join('')}
            </select>
            <select class="s-par" onchange="updateCodification()">
                <option value="">(Sin Parám.)</option>
                ${Object.entries(DATA.parametro).map(([k,v]) => `<option value="${k}">${v} (${k})</option>`).join('')}
            </select>
            <input type="text" class="s-cuad" placeholder="Cuadrante AB1234" oninput="updateCodification()" maxlength="6">
            <input type="text" class="s-ang" placeholder="Ángulo 045" oninput="updateCodification()" maxlength="3">
            <input type="text" class="s-dist" placeholder="Distancia 1234" oninput="updateCodification()" maxlength="6">
            <input type="text" class="s-time" placeholder="Hora HHMM" oninput="updateCodification()" maxlength="4">
            <input type="text" class="s-num" placeholder="Número (hasta 6 dígitos)" oninput="updateCodification()" maxlength="6">
            <select class="s-est" onchange="updateCodification()">
                <option value="">(Sin Estado)</option>
                ${Object.entries(DATA.estado).map(([k,v]) => `<option value="${k}">${v} (${k})</option>`).join('')}
            </select>
            <button onclick="this.parentElement.remove(); updateCodification();" style="background:#e74c3c">X</button>
        `;
        container.appendChild(div);
        updateCodification();
    }

    function updateCodification() {
        const msg = [];
        const trans = [];

        const emi = document.getElementById('c-emisor').value;
        const tip = document.getElementById('c-tipo').value;
        const rec = document.getElementById('c-receptor').value;

        msg.push(encodeNumbers(emi), tip, encodeNumbers(rec));
        trans.push(DATA.emisor[emi], DATA.tipo[tip], DATA.receptor[rec]);

        document.querySelectorAll('.segment').forEach(seg => {
            const obj = seg.querySelector('.s-obj').value;
            const par = seg.querySelector('.s-par').value;
            const cuad = seg.querySelector('.s-cuad').value;
            const ang = seg.querySelector('.s-ang').value;
            const dist = seg.querySelector('.s-dist').value;
            const time = seg.querySelector('.s-time').value;
            const num = seg.querySelector('.s-num') ? seg.querySelector('.s-num').value : '';
            const est = seg.querySelector('.s-est').value;

            if (obj) { msg.push(obj); trans.push(DATA.objeto[obj]); }
            if (par) { msg.push(par); trans.push(DATA.parametro[par]); }

            if (cuad) {
                const quadBlocks = formatQuadrant(cuad);
                if (quadBlocks) {
                    const encodedQuadNum = encodeNumbers(quadBlocks[1]);
                    msg.push(quadBlocks[0], encodedQuadNum);
                    trans.push(`Cuadrante ${quadBlocks[0].slice(2)}${quadBlocks[1]}`);
                }
            }

            if (ang) {
                const angBlock = formatAngle(ang);
                if (angBlock) {
                    msg.push(angBlock);
                    trans.push(`Ángulo ${angBlock.slice(1)}°`);
                }
            }

            if (dist) {
                const distBlocks = formatDistance(dist);
                if (distBlocks) {
                    const enc1 = distBlocks[0].slice(0,1) + encodeNumbers(distBlocks[0].slice(1));
                    const enc2 = encodeNumbers(distBlocks[1].slice(0, distBlocks[1].length-1)) + distBlocks[1].slice(-1);
                    msg.push(enc1, enc2);
                    trans.push(`Distancia ${normalizeDigits(dist)} m`);
                }
            }

            if (time) {
                const timeBlocks = formatTime(time);
                if (timeBlocks) {
                    const encHH = timeBlocks[0].slice(0,2) + encodeNumbers(timeBlocks[0].slice(2));
                    const encMM = timeBlocks[1].slice(0,2) + encodeNumbers(timeBlocks[1].slice(2));
                    msg.push(encHH, encMM);
                    trans.push(`Hora ${timeBlocks[0].slice(2)}:${timeBlocks[1].slice(2)}`);
                }
            }

            if (seg.querySelector('.s-num')) {
                const num = seg.querySelector('.s-num').value;
                const digits = normalizeDigits(num);
                if (digits) {
                    // limit to 6 significant digits (can be changed if needed)
                    const trimmed = digits.slice(-6).padStart(6, '0');
                    const enc = encodeNumbers(trimmed); // 6 letters
                    const block1 = 'N' + enc.slice(0,3);
                    const block2 = enc.slice(3) + 'N';
                    msg.push(block1, block2);
                    trans.push(trimmed);
                }
            }

            if (est) { msg.push(est); trans.push(DATA.estado[est]); }
        });

        msg.push('EPPP');
        trans.push('Fin.');

        document.getElementById('codified-output').innerText = msg.join('');
        document.getElementById('codified-translation').innerText = trans.join(' ');
    }

    function translateRaw() {
        const input = document.getElementById('t-input').value.replace(/\s+/g, '').toUpperCase();
        const chunks = chunkString(input, 4);
        const result = [];

        for (let i = 0; i < chunks.length; i++) {
            const word = chunks[i];
            if (i === 0) {
                const em = decodeNumbers(word.charAt(0));
                const tp = word.slice(1, 3);
                const rc = decodeNumbers(word.charAt(3));
                result.push(DATA.emisor[em] || em);
                result.push(DATA.tipo[tp] || tp);
                result.push(DATA.receptor[rc] || rc);
                continue;
            }

            if (word === 'EPPP') {
                result.push('Fin.');
                break;
            }

            if (/^CU[A-Z]{2}$/.test(word) && chunks[i + 1] && /^[A-Z]{4}$/.test(chunks[i + 1])) {
                const quadDigits = decodeNumbers(chunks[i + 1]);
                result.push(`Cuadrante ${word.slice(2)}${quadDigits}`);
                i += 1;
                continue;
            }

            if (/^G\d{3}$/.test(word)) {
                result.push(`Ángulo ${parseInt(word.slice(1), 10)}°`);
                continue;
            }

            if (/^N[A-Z]{3}$/.test(word) && chunks[i + 1] && /^[A-Z]{3}N$/.test(chunks[i + 1])) {
                const encoded = word.slice(1) + chunks[i + 1].slice(0, 3);
                const digits = decodeNumbers(encoded);
                result.push(`Número ${digits.replace(/^0+/, '') || '0'}`);
                i += 1;
                continue;
            }

            if (/^D[A-Z]{3}$/.test(word) && chunks[i + 1] && /^[A-Z]{3}M$/.test(chunks[i + 1])) {
                const part1 = decodeNumbers(word.slice(1));
                const part2 = decodeNumbers(chunks[i + 1].slice(0, 3));
                result.push(`Distancia ${part1 + part2} m`);
                i += 1;
                continue;
            }

            if (/^HH[A-Z]{2}$/.test(word) && chunks[i + 1] && /^MM[A-Z]{2}$/.test(chunks[i + 1])) {
                const hh = decodeNumbers(word.slice(2));
                const mm = decodeNumbers(chunks[i + 1].slice(2));
                result.push(`Hora ${hh}:${mm}`);
                i += 1;
                continue;
            }

            if (DATA.objeto[word]) {
                result.push(DATA.objeto[word]);
            }
            else if (DATA.parametro[word]) {
                result.push(DATA.parametro[word]);
            }
            else if (DATA.estado[word]) {
                result.push(DATA.estado[word]);
            }
            else {
                result.push(decodeNumbers(word));
            }
        }

        document.getElementById('translation-output').innerText = result.join(' ');
    }

    // Función para copiar el texto codificado al portapapeles
    function copyToClipboard() {
        // Obtenemos el texto actual dentro de la caja de resultado
        const textToCopy = document.getElementById('codified-output').innerText;
        
        // Usamos la API de Clipboard del navegador para copiar el texto
        navigator.clipboard.writeText(textToCopy).then(() => {
            // Mostramos una pequeña alerta (opcional) para confirmar que se copió
            alert("¡Mensaje copiado al portapapeles!");
        }).catch(err => {
            // En caso de error, lo mostramos en la consola
            console.error("Hubo un error al copiar el texto: ", err);
        });
    }
    
    // Inicializar
    updateCodification();
</script>

</body>
</html>
