<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codificador de Radio WPC</title>
    <style>
	
        body { 
			font-family: sans-serif; 
			background-color: #1a1a24; /* Fondo principal oscuro */
			padding: 20px; 
			color: #e0e0e0; /* Texto claro para que se lea bien */
		}
		
        .container { 
			max-width: 900px; 
			margin: auto; 
			background: #2a2a35; /* Gris oscuro, pero más claro que el body */
			padding: 20px; 
			border-radius: 8px; 
			box-shadow: 0 4px 15px rgba(0,0,0,0.5); /* Sombra más fuerte para dar profundidad */
		}
		
		h1, h2 { 
			color: #74b9ff; /* Azul claro pastel */
			border-bottom: 2px solid #3d3d4e; /* Línea divisoria oscura */
			padding-bottom: 10px; 
		}
		
		.section { 
			margin-bottom: 30px; 
			padding: 15px; 
			border: 1px solid #3d3d4e; /* Borde oscuro */
			border-radius: 5px; 
			background-color: #23232e; /* Fondo sutilmente distinto para agrupar elementos */
		}

        .row {
			display: flex;
			gap: 10px;
			margin-bottom: 10px;
			align-items: center;
			flex-wrap: wrap;
		}

		select, input { 
			padding: 8px; 
			border: 1px solid #4a4a5e; 
			border-radius: 4px; 
			background-color: #333342; /* Fondo de la caja de texto */
			color: #ffffff; /* Letras blancas al escribir */
		}
		
		input::placeholder { 
			color: #888; /* Color gris para el texto de sugerencia */
		}

        button { padding: 8px 15px; cursor: pointer; border: none; border-radius: 4px; background-color: #3498db; color: white; transition: 0.3s; }
        button:hover { background-color: #2980b9; }
        button.add-btn { background-color: #27ae60; font-weight: bold; }

		.result-box { 
			margin-top: 20px; 
			padding: 15px; 
			background: #1e272e; /* Fondo muy oscuro, casi negro */
			border-left: 5px solid #0984e3; 
			font-family: monospace; 
			font-size: 1.2em; 
			min-height: 1.5em; 
			color: #00d2d3; /* Texto color cyan para que el código destaque */
		}
		
		.translation-box { 
			color: #b2bec3; /* Gris claro apagado para no robar atención */
			font-style: italic; 
			margin-top: 5px; 
		}

        .segment { 
            border-left: 3px solid #00b894; 
            padding-left: 10px; 
            margin-left: 5px; 
            background-color: #2a2a35;
            padding-top: 10px;
            padding-bottom: 10px;
            border-radius: 0 4px 4px 0;
            flex-wrap: nowrap; /* Fuerza a que todo quede en un solo renglón */
            overflow-x: auto; /* Agrega scroll horizontal solo si la pantalla es diminuta */
        }

        /* Limita el ancho de los selectores dentro de los segmentos */
        .segment select {
            max-width: 140px; 
            text-overflow: ellipsis; /* Agrega "..." si el texto es muy largo */
        }

    </style>
</head>
<body>

<div class="container">
    <h1>Codificador / Decodificador WPC</h1>

    <div class="section">
        <h2>Codificar Mensaje</h2>
        <div id="codificador-form">
            <div class="row">
                <label>Emisor:</label>
                <select id="c-emisor" onchange="updateCodification()">
                    <option value="B">BDU (B)</option>
                    <option value="Z">U96 (Z)</option>
                    <option value="W">U552 (W)</option>
                    <option value="R">U564 (R)</option>
                    <option value="U">U307 (U)</option>
                </select>

                <label>Tipo:</label>
                <select id="c-tipo" onchange="updateCodification()">
                    <option value="ON">Orden (ON)</option>
                    <option value="QS">Pregunta (QS)</option>
                    <option value="IA">Informa (IA)</option>
                    <option value="SA">Solicitud (SA)</option>
                    <option value="CN">Confirmación (CN)</option>
                </select>

                <label>Receptor:</label>
                <select id="c-receptor" onchange="updateCodification()">
                    <option value="B">BDU (B)</option>
                    <option value="Z">U96 (Z)</option>
                    <option value="W">U552 (W)</option>
                    <option value="R">U564 (R)</option>
                    <option value="U">U307 (U)</option>
                    <option value="A">Todos (A)</option>
                </select>
            </div>

            <div id="dynamic-segments">
                </div>

            <div class="row">
                <button class="add-btn" onclick="addSegment()">+ Agregar Objeto/Estado</button>
            </div>

            <div class="row">
                <label>Cierre: <strong>E</strong></label>
            </div>
        </div>

        <div style="display: flex; gap: 10px; align-items: stretch; margin-top: 20px;">
            <div class="result-box" id="codified-output" style="flex-grow: 1; margin-top: 0;">B ON A E</div>
            <button onclick="copyToClipboard()" style="background-color: #f39c12; margin-top: 0;">Copiar</button>
        </div>
        <div class="translation-box" id="codified-translation">BDU ordena a todos: Fin.</div>
        
    </div>

    <div class="section">
        <h2>Traducir Mensaje Armado</h2>
        <p><small>Introduce las abreviaturas separadas por espacios para ver la traducción.</small></p>
        <input type="text" id="t-input" style="width: 80%;" placeholder="Ej: Z QS B SUBM POSI 082G E" oninput="translateRaw()">
        <div class="result-box" id="translation-output">---</div>
    </div>
</div>

<script>
    // Diccionarios basados en el documento [cite: 1, 4, 11, 23, 34, 47]
    const DATA = {
        emisor: { "B": "BDU", "Z": "U96", "W": "U552", "R": "U564", "U": "U307" },
        tipo: { "ON": "Ordena", "QS": "Pregunta", "IA": "Informa", "SA": "Solicita", "CN":  "Confirmación"},
        receptor: { "B": "a BDU", "Z": "a U96", "W": "a U552", "R": "a U564", "U": "a U307", "A": "a todos los submarinos" },
        objeto: { 
            "SUBM": "Submarino", "CONV": "Convoy", "TOIP": "Tiempo impacto", "VISU": "Contacto Visual", "HIDO": "Contacto Hidro",
            "BUQG": "Buque de Guerra", "MECA": "Mercante", "PASA": "Pasajeros", "TANP": "Tanquero pesado"
        },
        parametro: { 
            "POSI": "Posición", "RUMB": "Rumbo", "DIST": "Distancia", "VELO": "Velocidad", "DIRE": "Dirección", "AONB": "Angle on bow",
            "PROA": "Proa", "POPA": "Popa", "ESTR": "Estribor", "BABO": "Babor",
            "NORT": "Norte", "SUUR": "Sur", "ESTE": "Este", "OEST": "Oeste",
            "TORA": "Torpedos en agua", "TORE": "Torpedos restantes", "IDEN": "Identificación", "FURT": "Nav. Silenciosa" 
        },
        estado: { 
            "CONF": "Confirmación requerida", "SI": "Confirmado", "NO": "Denegado", "OK": "Sin quejas", "SOS": "Auxilio inmediato", 
            "INM": "Inmersión profunda", "EME": "Inmersión emergencia", "FCO": "Retirada combate", "FMI": "Retirada misión" 
        }
    };

    // Reglas de sustitución para números
    const numToChar = {'1':'Q', '2':'W', '3':'E', '4':'R', '5':'T', '6':'Z', '7':'U', '8':'I', '9':'O', '0':'P'};
    const charToNum = {'Q':'1', 'W':'2', 'E':'3', 'R':'4', 'T':'5', 'Z':'6', 'U':'7', 'I':'8', 'O':'9', 'P':'0'};

    // Función para codificar (Números -> Letras)
    function encodeNumbers(str) {
        if (!str) return str;
        return str.toUpperCase().replace(/[0-9]/g, m => numToChar[m]);
    }

    // Función para decodificar (Letras -> Números)
    function decodeNumbers(str) {
        if (!str) return str;
        return str.toUpperCase().split('').map(c => charToNum[c] || c).join('');
    }

    function addSegment() {
        const container = document.getElementById('dynamic-segments');
        const div = document.createElement('div');
        div.className = 'row segment';
        div.innerHTML = `
            <select class="s-obj" onchange="updateCodification()">
                <option value="">(Sin Objeto)</option>
                ${Object.entries(DATA.objeto).map(([k,v]) => `<option value="${k}">${v} (${k})</option>`).join('')}
            </select>
            <select class="s-par" onchange="updateCodification()">
                <option value="">(Sin Parám.)</option>
                ${Object.entries(DATA.parametro).map(([k,v]) => `<option value="${k}">${v} (${k})</option>`).join('')}
            </select>
            <input type="text" class="s-val1" placeholder="Val 1" oninput="updateCodification()" style="width:70px" maxlength="4">
            <input type="text" class="s-val2" placeholder="Val 2" oninput="updateCodification()" style="width:70px" maxlength="4">
            <select class="s-est" onchange="updateCodification()">
                <option value="">(Sin Estado)</option>
                ${Object.entries(DATA.estado).map(([k,v]) => `<option value="${k}">${v} (${k})</option>`).join('')}
            </select>
            <button onclick="this.parentElement.remove(); updateCodification();" style="background:#e74c3c">X</button>
        `;
        container.appendChild(div);
        updateCodification();
    }

    function updateCodification() {
        let msg = [];
        let trans = [];

        const emi = document.getElementById('c-emisor').value;
        const tip = document.getElementById('c-tipo').value;
        const rec = document.getElementById('c-receptor').value;

        // Aplica el cifrado al emisor y al receptor
        msg.push(encodeNumbers(emi), tip, encodeNumbers(rec));
        trans.push(DATA.emisor[emi], DATA.tipo[tip], DATA.receptor[rec]);

        document.querySelectorAll('.segment').forEach(seg => {
            const obj = seg.querySelector('.s-obj').value;
            const par = seg.querySelector('.s-par').value;
            const val1 = seg.querySelector('.s-val1').value;
            const val2 = seg.querySelector('.s-val2').value;
            const est = seg.querySelector('.s-est').value;

            if(obj) { msg.push(obj); trans.push(DATA.objeto[obj]); }
            if(par) { msg.push(par); trans.push(DATA.parametro[par]); }
            if(val1) { 
                // Rellena con ceros a la izquierda hasta llegar a 4 caracteres
                let paddedVal1 = val1.padStart(4, '0');
                msg.push(encodeNumbers(paddedVal1)); 
                trans.push(paddedVal1); 
            }

            if(val2) { 
                // Rellena con ceros a la izquierda hasta llegar a 4 caracteres
                let paddedVal2 = val2.padStart(4, '0');
                msg.push(encodeNumbers(paddedVal2)); 
                trans.push(paddedVal2); 
            }

            if(est) { msg.push(est); trans.push(DATA.estado[est]); }
        });

        msg.push("E");
        trans.push("Fin.");

        document.getElementById('codified-output').innerText = msg.join(' ');
        document.getElementById('codified-translation').innerText = trans.join(' ');
    }

    function translateRaw() {
        const input = document.getElementById('t-input').value.trim().split(/\s+/);
        let result = [];

        input.forEach((word, index) => {
            if (index === 0) {
                // Posición 0: Emisor (descifrar primero)
                let decEmi = decodeNumbers(word);
                result.push(DATA.emisor[decEmi] || decEmi);
            }
            else if (index === 1 && DATA.tipo[word]) {
                result.push(DATA.tipo[word]);
            }
            else if (index === 2) {
                // Posición 2: Receptor (descifrar primero)
                let decRec = decodeNumbers(word);
                result.push(DATA.receptor[decRec] || decRec);
            }
            else if (DATA.objeto[word]) {
                result.push(DATA.objeto[word]);
            }
            else if (DATA.parametro[word]) {
                result.push(DATA.parametro[word]);
            }
            else if (DATA.estado[word]) {
                result.push(DATA.estado[word]);
            }
            else if (word === "E" && index === input.length - 1) {
                // Asegura que la "E" de cierre solo se traduzca si está al final absoluto del mensaje
                result.push("Fin.");
            }
            else {
                // Si la palabra no está en los diccionarios, es el campo de VALOR. Desciframos.
                result.push(decodeNumbers(word)); 
            }
        });

        document.getElementById('translation-output').innerText = result.join(' ');
    }

    // Función para copiar el texto codificado al portapapeles
    function copyToClipboard() {
        // Obtenemos el texto actual dentro de la caja de resultado
        const textToCopy = document.getElementById('codified-output').innerText;
        
        // Usamos la API de Clipboard del navegador para copiar el texto
        navigator.clipboard.writeText(textToCopy).then(() => {
            // Mostramos una pequeña alerta (opcional) para confirmar que se copió
            alert("¡Mensaje copiado al portapapeles!");
        }).catch(err => {
            // En caso de error, lo mostramos en la consola
            console.error("Hubo un error al copiar el texto: ", err);
        });
    }
    
    // Inicializar
    updateCodification();
</script>

</body>
</html>
